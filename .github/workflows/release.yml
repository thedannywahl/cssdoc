name: Release

# Tag-driven: `vp run release` bumps + tags locally; pushing the `v*` tag triggers this.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - name: Gate
        run: vp run ready
      # Tokenless OIDC trusted publishing (no NODE_AUTH_TOKEN). Requires a trusted publisher configured
      # on npm for each @cssdoc/* package (repo thedannywahl/cssdoc, workflow release.yml). The `id-token`
      # permission lets vp exchange the OIDC token for a short-lived publish token against the default
      # registry; provenance is attested from the same identity.
      - name: Publish to npm
        run: vp run publish # vp pm publish -r --provenance --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  # Deploy the docs once the packages are on npm. Depends only on `publish`, so a flaky extension
  # publish (below) never blocks it.
  docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  publish-extension:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      # Package once, then publish to each marketplace independently. The Marketplace (vsce) is
      # best-effort — a failing PAT there must not skip the Open VSX publish — and the .vsix is
      # attached to the Release so it can be uploaded to the Marketplace by hand / sideloaded.
      - name: Package extension
        run: vp run ext:package
      - name: Attach .vsix to the release
        uses: softprops/action-gh-release@v3
        with:
          files: servers/vscode/cssdoc.vsix
      - name: Publish to VS Code Marketplace (best-effort)
        continue-on-error: true
        run: vp run ext:publish:vsce
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: vp run ext:publish:ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  package-zed:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Test Zed extension
        run: cargo test --locked --manifest-path servers/zed/Cargo.toml
      - name: Build and package Zed extension
        run: |
          version="$(node -p "require('./servers/language-server/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match language server version $version" >&2
            exit 1
          fi
          vp run zed:package
      - name: Attach Zed extension to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/cssdoc-zed-*.tar.gz
          fail_on_unmatched_files: true

  update-zed-registry:
    # Disabled unless the repository variable is explicitly set to true.
    if: ${{ vars.ZED_REGISTRY_UPDATE_ENABLED == 'true' }}
    needs: package-zed
    runs-on: ubuntu-latest
    concurrency:
      group: zed-registry-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - name: Create or update Zed registry pull request
        run: |
          gh auth setup-git
          bash scripts/update-zed-registry.sh
        env:
          GH_TOKEN: ${{ secrets.ZED_REGISTRY_TOKEN }}
