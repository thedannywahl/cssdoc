packages:
  - packages/*
  - emitters/*
  - generators/*
  - plugins/*
  - servers/*
  - syntaxes/*/*
  - docs

catalogMode: prefer

catalog:
  # Toolchain
  typescript: ^7.0.2
  "@types/node": ^26.5.0
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
  # Lint adapters
  oxlint: 1.81.0
  # Core
  postcss: ^8.5.28
  postcss-value-parser: ^4.2.0
  grammarkdown: ^3.3.2
  # CSS value / @property syntax matching
  css-tree: ^3.2.1
  "@types/css-tree": ^2.3.11
  # Config
  ajv: ^8.20.0
  jsonc-parser: ^3.3.1
  # CLI
  commander: ^15.0.0
  "@commander-js/extra-typings": ^15.0.0
  "@clack/prompts": ^1.8.0
  "@bomb.sh/tab": ^0.0.22
  # TypeDoc integration
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.13.0
  typedoc-vitepress-theme: ^1.1.3
  stylelint: ^17.15.0
  eslint: ^10.10.0
  "@eslint/css": ^1.4.0
  "@html-eslint/parser": ^0.65.0
  # Language server + editor
  vscode-languageserver: ^10.1.1
  vscode-languageserver-textdocument: ^1.0.14
  vscode-languageclient: ^10.1.1
  esbuild: ^0.28.2
  # Pinned to the version that vsce 3.9.2 uses
  "@types/vscode": 1.125.0
  "@vscode/vsce": ^3.9.2
  ovsx: ^1.1.1
  "@resvg/resvg-js": ^2.6.2
  # Docs site
  vitepress: 2.0.0-alpha.19
  # Quality gates
  "@vitest/coverage-v8": 4.1.11
  publint: ^0.3.24
  # Release
  changelogen: ^0.6.2
  bumpp: ^12.3.0
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  postcss-styled-syntax: ^0.7.2
  postcss-html: ^2.0.0
  vitepress-plugin-llms: ^1.13.5
  "@codemirror/language": ^6.12.4
  "@codemirror/state": ^6.7.4
  "@codemirror/view": ^6.43.11
  "@codemirror/lang-css": ^6.3.1
  "@codemirror/lang-html": ^6.4.12
  "@codemirror/lang-json": ^6.0.2
  "@codemirror/theme-one-dark": ^6.1.3
  codemirror: ^6.0.2
  markdown-it: 15.0.0
  vue: ^3.5.42
  mermaid: ^11.17.2
  postcss-less: ^6.0.0
  postcss-scss: ^4.0.9
  vitest: 4.1.11

overrides:
  "mermaid@>=11.17.1 <12.0.0-0": 11.17.2
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  esbuild: true
  "@vscode/vsce-sign": false
  keytar: false

minimumReleaseAgeExclude:
  - mermaid@11.17.2
  - "@types/node@26.3.0"
  - "@voidzero-dev/vite-plus-core@0.3.1"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.3.1"
  - "@voidzero-dev/vite-plus-darwin-x64@0.3.1"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.1"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.3.1"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.3.1"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.3.1"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.1"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.3.1"
  - vite-plus@0.3.1
  - "@clack/core@1.5.0"
  - "@clack/prompts@1.8.0"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
