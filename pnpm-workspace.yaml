packages:
  - packages/*
  - emitters/*
  - generators/*
  - plugins/*
  - servers/*
  - syntaxes/*/*
  - docs

catalogMode: prefer

catalog:
  # Toolchain
  # Match the upstream TypeScript version used by Vite+'s bundled tsrs.
  typescript: 7.1.0-beta
  "@types/node": ^26.6.6
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
  # Regex patterns (ArkRegex - type-safe regex)
  arkregex: ^0.0.15
  # Schema validation (ArkType - TypeScript-first schema validation)
  arktype: ^2.2.10
  # Core
  postcss: ^8.5.33
  postcss-value-parser: ^4.2.0
  grammarkdown: ^3.3.2
  # CSS value / @property syntax matching
  css-tree: ^3.2.1
  "@types/css-tree": ^3.2.0
  # Config
  ajv: ^8.20.0
  jsonc-parser: ^3.3.1
  # CLI
  commander: ^15.1.0
  "@commander-js/extra-typings": ^15.1.0
  "@clack/prompts": ^1.9.0
  "@bomb.sh/tab": ^0.0.23
  # TypeDoc integration
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.14.1
  typedoc-vitepress-theme: ^1.1.4
  stylelint: ^18.0.0
  eslint: ^10.15.0
  "@eslint/css": ^2.0.1
  "@html-eslint/parser": ^0.69.0
  # Language server + editor
  vscode-languageserver: ^11.0.1
  vscode-languageserver-textdocument: ^1.0.16
  vscode-languageclient: ^11.0.1
  esbuild: ^0.28.2
  # Pinned to the version that vsce 3.9.2 uses
  "@types/vscode": 1.146.0
  "@vscode/vsce": ^4.1.1
  ovsx: ^1.4.0
  "@resvg/resvg-js": ^2.6.2
  # Docs site
  "@pantoken/tokens": ^0.8.4
  "@pantoken/css": ^0.4.9
  "@pantoken/plugin-custom-icons": ^0.3.21
  "@pantoken/plugin-prune-custom-props": ^0.1.6
  "@pantoken/plugin-simple-icons": ^0.3.18
  "@pantoken/vitepress": ^0.3.0
  simple-icons: ^16.38.0
  vitepress: 2.0.0-alpha.21
  # Quality gates
  "@vitest/coverage-v8": 5.1.1
  publint: ^0.3.25
  # Release
  changelogen: ^0.6.2
  bumpp: ^12.3.0
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  postcss-styled-syntax: ^0.7.4
  postcss-html: ^2.0.1
  vitepress-plugin-llms: ^1.15.0
  "@codemirror/language": ^6.13.1
  "@codemirror/state": ^6.7.6
  "@codemirror/view": ^6.43.15
  "@codemirror/lang-css": ^6.3.1
  "@codemirror/lang-html": ^6.4.12
  "@codemirror/lang-json": ^6.0.2
  "@codemirror/theme-one-dark": ^6.1.3
  codemirror: ^6.0.2
  markdown-it: 15.0.3
  markdown-exit: ^2.1.3
  vue: ^3.5.45
  mermaid: ^12.3.0
  postcss-less: ^7.1.1
  postcss-scss: ^4.0.9
  vitest: 5.1.1
  vitepress-plugin-mermaid: ^2.0.17
  "@arethetypeswrong/cli": ^0.18.5
  eslint-plugin-tsdoc: ^0.5.4
  eslint-plugin-tsdoc-require-2: ^1.2.7
  mdast-util-from-markdown: ^2.1.0
  mdast-util-to-hast: 13.2.1
  hast-util-to-html: 9.0.5

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # Lezer trees use instanceof checks; mixed copies break CodeMirror's HTML parser.
  "@lezer/common": ^1.5.6

allowBuilds:
  esbuild: true
  "@vscode/vsce-sign": false
  keytar: false

minimumReleaseAgeExclude:
  - "@voidzero-dev/*"
  - vite-plus
  - "@pantoken/*"
  - "@typescript/*"
  - typescript
  - "@html-eslint/parser@0.69.0"
  - "@html-eslint/template-syntax-parser@0.69.0"
  - "@html-eslint/types@0.69.0"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
