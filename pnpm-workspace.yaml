packages:
  - packages/*
  - emitters/*
  - generators/*
  - plugins/*
  - servers/*
  - syntaxes/*/*
  - docs

catalogMode: prefer

catalog:
  # Toolchain
  typescript: ^6.0.3
  "@types/node": ^26.3.0
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  # Core
  postcss: ^8.5.26
  postcss-value-parser: ^4.2.0
  grammarkdown: ^3.3.2
  # CSS value / @property syntax matching
  css-tree: ^3.2.1
  "@types/css-tree": ^2.3.11
  # Config
  ajv: ^8.20.0
  jsonc-parser: ^3.3.1
  # TypeDoc integration
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.12.0
  typedoc-vitepress-theme: ^1.1.3
  # Lint adapters
  stylelint: ^17.14.1
  eslint: ^10.9.0
  "@eslint/css": ^1.4.0
  "@html-eslint/parser": ^0.65.0
  # Language server + editor
  vscode-languageserver: ^10.1.0
  vscode-languageserver-textdocument: ^1.0.12
  vscode-languageclient: ^10.1.0
  "@types/vscode": ^1.134.0
  esbuild: ^0.28.2
  "@vscode/vsce": ^3.9.2
  ovsx: ^1.1.1
  "@resvg/resvg-js": ^2.6.2
  # Docs site
  vitepress: 2.0.0-alpha.19
  # Quality gates
  "@vitest/coverage-v8": ^4.1.11
  publint: ^0.3.24
  # Release
  changelogen: ^0.6.2
  bumpp: ^12.2.1
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  postcss-styled-syntax: ^0.7.2
  postcss-html: ^2.0.0
  vitepress-plugin-llms: ^1.13.5
  '@codemirror/language': ^6.12.4
  '@codemirror/state': ^6.7.1
  '@codemirror/view': ^6.43.9

overrides:
  "mermaid@>=11.17.1 <12.0.0-0": 11.17.2

allowBuilds:
  esbuild: true
  "@vscode/vsce-sign": false
  keytar: false

minimumReleaseAgeExclude:
  - mermaid@11.17.2
  - "@types/node@26.3.0"
